version: '3.8'

services:
  couchdb:
    image: couchdb:3.4.2
    container_name: hourclick-couchdb
    restart: unless-stopped
    ports:
      - "5984:5984"
    env_file:
      - .env
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
      - COUCHDB_SECRET=${COUCHDB_SECRET}
    volumes:
      - couchdb_data:/opt/couchdb/data
      - ./couchdb/local.ini:/opt/couchdb/etc/local.ini
    networks:
      - hourclick-network

  app:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
      args:
        VITE_COUCHDB_URL: ${VITE_COUCHDB_URL}
        VITE_COUCHDB_USER: ${COUCHDB_USER}
        VITE_COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    container_name: hourclick-app
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - couchdb
    networks:
      - hourclick-network

  caddy:
    image: caddy:2.8-alpine
    container_name: hourclick-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    environment:
      - HOURCLICK_HOST=${HOURCLICK_HOST:-localhost}
      - HOURCLICK_EMAIL=${HOURCLICK_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - hourclick-network

volumes:
  couchdb_data:
    name: hourclick_couchdb_data
  caddy_data:
    name: hourclick_caddy_data
  caddy_config:
    name: hourclick_caddy_config

networks:
  hourclick-network:
